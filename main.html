<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>부산기계공업고등학교 급식표</title>
    <style>
        * { box-sizing: border-box; }
        body { font-family: 'Pretendard', sans-serif; background-color: #f4f7f6; text-align: center; padding: 30px 15px; margin: 0; }
        .container { max-width: 500px; margin: 0 auto; background: white; padding: 30px 20px; border-radius: 20px; box-shadow: 0 10px 20px rgba(0,0,0,0.05); }
        h1 { color: #2c3e50; margin-bottom: 15px; font-size: 1.5em; }
        
        /* 검색창 스타일 */
        .search-box { position: relative; margin-bottom: 15px; }
        .search-box input {
            width: 100%;
            padding: 12px 15px;
            font-size: 0.95em;
            border: 2px solid #cbd5e1;
            border-radius: 12px;
            outline: none;
            transition: all 0.2s;
        }
        .search-box input:focus { border-color: #0f766e; box-shadow: 0 0 0 3px #ccfbf1; }
        
        /* 검색 자동완성 드롭다운 */
        .search-results {
            position: absolute; top: 100%; left: 0; right: 0;
            background: white; border: 1px solid #cbd5e1;
            border-radius: 12px; max-height: 220px; overflow-y: auto;
            z-index: 100; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1);
            display: none; text-align: left; margin-top: 5px;
        }
        .search-item {
            padding: 10px 15px; cursor: pointer; border-bottom: 1px solid #f1f5f9;
            font-size: 0.92em; display: flex; justify-content: space-between; align-items: center;
        }
        .search-item:hover { background-color: #f0fdf4; color: #0f766e; }
        .search-item-date { font-size: 0.8em; color: #64748b; font-weight: bold; }

        /* 날짜 선택 박스 */
        .date-picker-box { margin-bottom: 20px; }
        .date-picker-box input {
            font-family: inherit;
            font-size: 1em;
            padding: 10px 15px;
            border: 2px solid #0f766e;
            border-radius: 10px;
            outline: none;
            color: #2c3e50;
            background-color: #ffffff;
            font-weight: bold;
            cursor: pointer;
        }

        .date { color: #7f8c8d; font-size: 1.1em; margin-bottom: 20px; font-weight: bold; }
        
        /* 급식 카드 */
        .meal-grid { display: flex; flex-direction: column; gap: 20px; }
        .meal-card { background-color: #f8fafc; border: 1px solid #e2e8f0; padding: 20px; border-radius: 15px; text-align: left; }
        .meal-title { font-size: 1.15em; font-weight: bold; color: #0f766e; margin-bottom: 12px; border-bottom: 2px solid #ccfbf1; padding-bottom: 6px; }
        .meal-content { font-size: 0.98em; line-height: 1.9; color: #334155; font-weight: 500; }
        
        .allergy-info { margin-top: 25px; padding: 15px; background: #f1f5f9; border-radius: 12px; font-size: 0.75em; color: #64748b; text-align: left; line-height: 1.6; }
        .allergy-title { font-weight: bold; margin-bottom: 6px; color: #334155; }
        .no-meal { color: #94a3b8; font-style: italic; font-size: 0.9em; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🛠️ 부산기계공고 급식표</h1>
        
        <!-- 메뉴 검색 영역 -->
        <div class="search-box">
            <input type="text" id="search-input" placeholder="🔍 메뉴 검색 (예: 우유, 비엔나, 닭)" autocomplete="off">
            <div id="search-results" class="search-results"></div>
        </div>

        <!-- 날짜 선택 달력 -->
        <div class="date-picker-box">
            <input type="date" id="date-picker">
        </div>

        <div class="date" id="date-display">날짜 불러오는 중...</div>
        
        <div class="meal-grid" id="meal-container">
            <div style="text-align:center; color:#64748b;">급식 정보를 불러오는 중입니다 ⏳</div>
        </div>

        <div class="allergy-info">
            <div class="allergy-title">💡 알레르기 유발물질 안내 (메뉴 옆 숫자)</div>
            1.난류 2.우유 3.메밀 4.땅콩 5.대두 6.밀 7.고등어 8.게 9.새우 10.돼지고기 11.복숭아 12.토마토 13.아황산류 14.호두 15.닭고기 16.쇠고기 17.오징어 18.조개류 19.잣
        </div>
    </div>

    <script>
        const officeCode = "C10";
        const schoolCode = "1421117";

        const datePicker = document.getElementById('date-picker');
        const searchInput = document.getElementById('search-input');
        const searchResults = document.getElementById('search-results');
        const today = new Date();

        let mealRangeCache = []; // 최근 60일간의 급식 데이터 저장용

        function formatDateISO(dateObj) {
            const y = dateObj.getFullYear();
            const m = String(dateObj.getMonth() + 1).padStart(2, '0');
            const d = String(dateObj.getDate()).padStart(2, '0');
            return `${y}-${m}-${d}`;
        }

        function formatDateStr(dateObj) {
            return formatDateISO(dateObj).replace(/-/g, '');
        }

        // 선택 가능 범위: -30일 ~ +30일
        const minDate = new Date();
        minDate.setDate(today.getDate() - 30);
        const maxDate = new Date();
        maxDate.setDate(today.getDate() + 30);

        datePicker.value = formatDateISO(today);
        datePicker.min = formatDateISO(minDate);
        datePicker.max = formatDateISO(maxDate);

        // 1. 전체 기간 급식 데이터 한 번에 불러오기 (검색 기능용)
        function loadRangeMealData() {
            const fromYMD = formatDateStr(minDate);
            const toYMD = formatDateStr(maxDate);
            const rangeUrl = `https://open.neis.go.kr/hub/mealServiceDietInfo?Type=json&pSize=1000&ATPT_OFCDC_SC_CODE=${officeCode}&SD_SCHUL_CODE=${schoolCode}&MLSV_FROM_YMD=${fromYMD}&MLSV_TO_YMD=${toYMD}`;

            fetch(rangeUrl)
                .then(res => res.json())
                .then(data => {
                    if (data.mealServiceDietInfo) {
                        mealRangeCache = data.mealServiceDietInfo[1].row;
                    }
                })
                .catch(err => console.error("검색용 데이터 로딩 실패:", err));
        }

        // 2. 특정 날짜의 급식표 화면 표시
        function fetchMealData(selectedDateISO) {
            const [year, month, day] = selectedDateISO.split('-');
            const dateStr = `${year}${month}${day}`;

            document.getElementById('date-display').innerText = `${year}년 ${parseInt(month)}월 ${parseInt(day)}일`;

            const apiUrl = `https://open.neis.go.kr/hub/mealServiceDietInfo?Type=json&ATPT_OFCDC_SC_CODE=${officeCode}&SD_SCHUL_CODE=${schoolCode}&MLSV_YMD=${dateStr}`;
            const container = document.getElementById('meal-container');
            container.innerHTML = `<div style="text-align:center; color:#64748b;">급식 정보를 불러오는 중입니다 ⏳</div>`;

            fetch(apiUrl)
                .then(res => res.json())
                .then(data => {
                    container.innerHTML = ""; 

                    if (data.mealServiceDietInfo) {
                        const rows = data.mealServiceDietInfo[1].row;
                        const mealData = { "조식": "", "중식": "", "석식": "" };

                        rows.forEach(item => {
                            const type = item.MMEAL_SC_NM;
                            if (mealData.hasOwnProperty(type)) {
                                mealData[type] = item.DDISH_NM;
                            }
                        });

                        ["조식", "중식", "석식"].forEach(type => {
                            const card = document.createElement('div');
                            card.className = 'meal-card';
                            
                            const content = mealData[type];
                            if (content) {
                                card.innerHTML = `
                                    <div class="meal-title">🍴 ${type}</div>
                                    <div class="meal-content">${content}</div>
                                `;
                            } else {
                                card.innerHTML = `
                                    <div class="meal-title">🍴 ${type}</div>
                                    <div class="meal-content no-meal">식단 정보가 없습니다.</div>
                                `;
                            }
                            container.appendChild(card);
                        });

                    } else if (data.RESULT) {
                        container.innerHTML = `<div class="meal-card" style="text-align:center;">오늘은 급식이 없습니다 😴<br><span class="no-meal">(${data.RESULT.MESSAGE})</span></div>`;
                    } else {
                        container.innerHTML = `<div class="meal-card" style="text-align:center;">급식 정보를 찾을 수 없습니다.</div>`;
                    }
                })
                .catch(err => {
                    console.error(err);
                    container.innerHTML = `<div class="meal-card" style="text-align:center;">급식 데이터를 불러오는 데 실패했습니다.</div>`;
                });
        }

        // 3. 실시간 메뉴 검색 및 자동완성 처리
        searchInput.addEventListener('input', (e) => {
            const keyword = e.target.value.trim();
            if (!keyword) {
                searchResults.style.display = 'none';
                return;
            }

            const matches = [];
            mealRangeCache.forEach(item => {
                // <br/>로 나뉘어 있는 메뉴 각각 분리
                const dishes = item.DDISH_NM.split(/<br\s*\/?>/i);
                dishes.forEach(dish => {
                    // 알레르기 번호 제거 후 이름만 추출해서 검색
                    const cleanName = dish.replace(/\s*\([0-9.]+\)/g, '').trim();
                    if (cleanName.includes(keyword)) {
                        const ymd = item.MLSV_YMD;
                        const iso = `${ymd.substr(0,4)}-${ymd.substr(4,2)}-${ymd.substr(6,2)}`;
                        matches.push({
                            name: cleanName,
                            dateISO: iso,
                            mealType: item.MMEAL_SC_NM
                        });
                    }
                });
            });

            if (matches.length === 0) {
                searchResults.innerHTML = `<div class="search-item" style="color:#94a3b8;">일치하는 메뉴가 없습니다.</div>`;
            } else {
                // 최대 15개까지만 추천 리스트에 표시
                searchResults.innerHTML = matches.slice(0, 15).map(m => `
                    <div class="search-item" data-date="${m.dateISO}">
                        <span><strong>${m.name}</strong></span>
                        <span class="search-item-date">${m.dateISO.substr(5)} (${m.mealType})</span>
                    </div>
                `).join('');
            }
            searchResults.style.display = 'block';
        });

        // 검색 드롭다운에서 메뉴 클릭 시 선택한 날짜 급식표로 이동
        searchResults.addEventListener('click', (e) => {
            const item = e.target.closest('.search-item');
            if (item && item.dataset.date) {
                const selectedDate = item.dataset.date;
                datePicker.value = selectedDate;
                fetchMealData(selectedDate);
                searchResults.style.display = 'none';
                searchInput.value = '';
            }
        });

        // 검색창 바깥 영역 클릭 시 드롭다운 닫기
        document.addEventListener('click', (e) => {
            if (!e.target.closest('.search-box')) {
                searchResults.style.display = 'none';
            }
        });

        // 초기 실행
        loadRangeMealData();
        fetchMealData(datePicker.value);

        // 달력 날짜 변경 시 갱신
        datePicker.addEventListener('change', (e) => {
            fetchMealData(e.target.value);
        });
    </script>
</body>
</html>
