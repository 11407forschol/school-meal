<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>부산기계공업고등학교 급식표</title>
    <style>
        * { box-sizing: border-box; }
        body { font-family: 'Pretendard', sans-serif; background-color: #f4f7f6; text-align: center; padding: 30px 15px; margin: 0; }
        .container { max-width: 500px; margin: 0 auto; background: white; padding: 30px 20px; border-radius: 20px; box-shadow: 0 10px 20px rgba(0,0,0,0.05); }
        h1 { color: #2c3e50; margin-bottom: 5px; font-size: 1.5em; }
        .date { color: #7f8c8d; font-size: 1em; margin-bottom: 25px; font-weight: bold; }
        
        .meal-grid { display: flex; flex-direction: column; gap: 20px; }
        .meal-card { background-color: #f8fafc; border: 1px solid #e2e8f0; padding: 20px; border-radius: 15px; text-align: left; }
        .meal-title { font-size: 1.15em; font-weight: bold; color: #0f766e; margin-bottom: 12px; border-bottom: 2px solid #ccfbf1; padding-bottom: 6px; }
        .meal-content { font-size: 0.98em; line-height: 1.9; color: #334155; font-weight: 500; }
        
        .allergy-info { margin-top: 25px; padding: 15px; background: #f1f5f9; border-radius: 12px; font-size: 0.75em; color: #64748b; text-align: left; line-height: 1.6; }
        .allergy-title { font-weight: bold; margin-bottom: 6px; color: #334155; }
        .no-meal { color: #94a3b8; font-style: italic; font-size: 0.9em; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🛠️ 부산기계공고 급식표</h1>
        <div class="date" id="date-display">날짜 불러오는 중...</div>
        
        <div class="meal-grid" id="meal-container">
            <div style="text-align:center; color:#64748b;">급식 정보를 불러오는 중입니다 ⏳</div>
        </div>

        <div class="allergy-info">
            <div class="allergy-title">💡 알레르기 유발물질 안내 (메뉴 옆 숫자)</div>
            1.난류 2.우유 3.메밀 4.땅콩 5.대두 6.밀 7.고등어 8.게 9.새우 10.돼지고기 11.복숭아 12.토마토 13.아황산류 14.호두 15.닭고기 16.쇠고기 17.오징어 18.조개류 19.잣
        </div>
    </div>

    <script>
        const officeCode = "C10";
        const schoolCode = "1421117";

        const today = new Date();
        const year = today.getFullYear();
        const month = String(today.getMonth() + 1).padStart(2, '0');
        const day = String(today.getDate()).padStart(2, '0');
        const dateStr = `${year}${month}${day}`;

        document.getElementById('date-display').innerText = `${year}년 ${today.getMonth() + 1}월 ${today.getDate()}일`;

        const apiUrl = `https://open.neis.go.kr/hub/mealServiceDietInfo?Type=json&ATPT_OFCDC_SC_CODE=${officeCode}&SD_SCHUL_CODE=${schoolCode}&MLSV_YMD=${dateStr}`;

        fetch(apiUrl)
            .then(res => res.json())
            .then(data => {
                const container = document.getElementById('meal-container');
                container.innerHTML = ""; 

                if (data.mealServiceDietInfo) {
                    const rows = data.mealServiceDietInfo[1].row;
                    
                    // 조식, 중식, 석식 구분 객체
                    const mealData = { "조식": "", "중식": "", "석식": "" };

                    // API에서 불러온 데이터 매핑 (숫자 삭제 없이 원본 유지)
                    rows.forEach(item => {
                        const type = item.MMEAL_SC_NM;
                        if (mealData.hasOwnProperty(type)) {
                            mealData[type] = item.DDISH_NM;
                        }
                    });

                    // 조식 -> 중식 -> 석식 순서로 카드 각각 생성
                    ["조식", "중식", "석식"].forEach(type => {
                        const card = document.createElement('div');
                        card.className = 'meal-card';
                        
                        const content = mealData[type];
                        if (content) {
                            card.innerHTML = `
                                <div class="meal-title">🍴 ${type}</div>
                                <div class="meal-content">${content}</div>
                            `;
                        } else {
                            card.innerHTML = `
                                <div class="meal-title">🍴 ${type}</div>
                                <div class="meal-content no-meal">식단 정보가 없습니다.</div>
                            `;
                        }
                        container.appendChild(card);
                    });

                } else if (data.RESULT) {
                    container.innerHTML = `<div class="meal-card" style="text-align:center;">오늘은 급식이 없습니다 😴<br><span class="no-meal">(${data.RESULT.MESSAGE})</span></div>`;
                } else {
                    container.innerHTML = `<div class="meal-card" style="text-align:center;">급식 정보를 찾을 수 없습니다.</div>`;
                }
            })
            .catch(err => {
                console.error(err);
                document.getElementById('meal-container').innerHTML = `<div class="meal-card" style="text-align:center;">급식 데이터를 불러오는 데 실패했습니다.</div>`;
            });
    </script>
</body>
</html>
