<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>부산기계공업고등학교 급식표</title>
    <style>
        * { box-sizing: border-box; }
        body { font-family: 'Pretendard', sans-serif; background-color: #f4f7f6; text-align: center; padding: 30px 15px; margin: 0; }
        .container { max-width: 500px; margin: 0 auto; background: white; padding: 30px 20px; border-radius: 20px; box-shadow: 0 10px 20px rgba(0,0,0,0.05); }
        h1 { color: #2c3e50; margin-bottom: 15px; font-size: 1.5em; }
        
        /* 식단 필터 버튼 (전체/조식/중식/석식) */
        .filter-buttons {
            display: flex;
            gap: 6px;
            justify-content: center;
            margin-bottom: 12px;
        }
        .filter-btn {
            border: 1px solid #cbd5e1;
            background: #f8fafc;
            color: #64748b;
            padding: 7px 15px;
            border-radius: 20px;
            font-size: 0.88em;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
        }
        .filter-btn.active {
            background: #0f766e;
            color: white;
            border-color: #0f766e;
            box-shadow: 0 2px 5px rgba(15, 118, 110, 0.3);
        }

        /* 검색창 스타일 */
        .search-box { position: relative; margin-bottom: 15px; }
        .search-box input {
            width: 100%;
            padding: 12px 15px;
            font-size: 0.95em;
            border: 2px solid #cbd5e1;
            border-radius: 12px;
            outline: none;
            transition: all 0.2s;
        }
        .search-box input:focus { border-color: #0f766e; box-shadow: 0 0 0 3px #ccfbf1; }
        
        /* 검색 자동완성 드롭다운 */
        .search-results {
            position: absolute; top: 100%; left: 0; right: 0;
            background: white; border: 1px solid #cbd5e1;
            border-radius: 12px; max-height: 280px; overflow-y: auto;
            z-index: 100; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1);
            display: none; text-align: left; margin-top: 5px;
        }
        .search-item {
            padding: 11px 15px; cursor: pointer; border-bottom: 1px solid #f1f5f9;
            font-size: 0.92em; display: flex; justify-content: space-between; align-items: center;
        }
        .search-item:hover { background-color: #f0fdf4; }
        .search-item-left { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
        .search-item-date { font-size: 0.82em; color: #64748b; font-weight: bold; white-space: nowrap; }

        /* 식단 구분 배지 (태그) */
        .badge {
            font-size: 0.73em;
            font-weight: bold;
            padding: 2px 7px;
            border-radius: 6px;
            display: inline-block;
        }
        .badge-breakfast { background-color: #fef3c7; color: #d97706; } /* 조식: 주황 */
        .badge-lunch { background-color: #dcfce7; color: #15803d; }     /* 중식: 초록 */
        .badge-dinner { background-color: #e0e7ff; color: #4338ca; }    /* 석식: 보라 */

        /* 날짜 선택 박스 */
        .date-picker-box { margin-bottom: 20px; }
        .date-picker-box input {
            font-family: inherit;
            font-size: 1em;
            padding: 10px 15px;
            border: 2px solid #0f766e;
            border-radius: 10px;
            outline: none;
            color: #2c3e50;
            background-color: #ffffff;
            font-weight: bold;
            cursor: pointer;
        }

        .date { color: #7f8c8d; font-size: 1.1em; margin-bottom: 20px; font-weight: bold; }
        
        /* 급식 카드 */
        .meal-grid { display: flex; flex-direction: column; gap: 20px; }
        .meal-card { background-color: #f8fafc; border: 1px solid #e2e8f0; padding: 20px; border-radius: 15px; text-align: left; }
        .meal-title { font-size: 1.15em; font-weight: bold; color: #0f766e; margin-bottom: 12px; border-bottom: 2px solid #ccfbf1; padding-bottom: 6px; }
        .meal-content { font-size: 0.98em; line-height: 1.9; color: #334155; font-weight: 500; }
        
        .allergy-info { margin-top: 25px; padding: 15px; background: #f1f5f9; border-radius: 12px; font-size: 0.75em; color: #64748b; text-align: left; line-height: 1.6; }
        .allergy-title { font-weight: bold; margin-bottom: 6px; color: #334155; }
        .no-meal { color: #94a3b8; font-style: italic; font-size: 0.9em; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🛠️ 부산기계공고 급식표</h1>
        
        <!-- 식단 구분 필터 (전체/조식/중식/석식) -->
        <div class="filter-buttons">
            <button class="filter-btn active" data-filter="ALL">전체</button>
            <button class="filter-btn" data-filter="조식">조식</button>
            <button class="filter-btn" data-filter="중식">중식</button>
            <button class="filter-btn" data-filter="석식">석식</button>
        </div>

        <!-- 메뉴 검색 영역 -->
        <div class="search-box">
            <input type="text" id="search-input" placeholder="🔍 메뉴 검색 (예: 우유, 비엔나, 돈까스)" autocomplete="off">
            <div id="search-results" class="search-results"></div>
        </div>

        <!-- 날짜 선택 달력 -->
        <div class="date-picker-box">
            <input type="date" id="date-picker">
        </div>

        <div class="date" id="date-display">날짜 불러오는 중...</div>
        
        <div class="meal-grid" id="meal-container">
            <div style="text-align:center; color:#64748b;">급식 정보를 불러오는 중입니다 ⏳</div>
        </div>

        <div class="allergy-info">
            <div class="allergy-title">💡 알레르기 유발물질 안내 (메뉴 옆 숫자)</div>
            1.난류 2.우유 3.메밀 4.땅콩 5.대두 6.밀 7.고등어 8.게 9.새우 10.돼지고기 11.복숭아 12.토마토 13.아황산류 14.호두 15.닭고기 16.쇠고기 17.오징어 18.조개류 19.잣
        </div>
    </div>

    <script>
        const officeCode = "C10";
        const schoolCode = "1421117";

        const datePicker = document.getElementById('date-picker');
        const searchInput = document.getElementById('search-input');
        const searchResults = document.getElementById('search-results');
        const filterBtns = document.querySelectorAll('.filter-btn');
        const today = new Date();

        let mealRangeCache = []; 
        let isDataLoading = false;
        let currentFilter = 'ALL'; // 식단 필터: ALL, 조식, 중식, 석식

        function formatDateISO(dateObj) {
            const y = dateObj.getFullYear();
            const m = String(dateObj.getMonth() + 1).padStart(2, '0');
            const d = String(dateObj.getDate()).padStart(2, '0');
            return `${y}-${m}-${d}`;
        }

        function formatDateStr(dateObj) {
            return formatDateISO(dateObj).replace(/-/g, '');
        }

        const minDate = new Date(today);
        const maxDate = new Date(today);
        maxDate.setDate(today.getDate() + 30);

        datePicker.value = formatDateISO(today);
        datePicker.min = formatDateISO(minDate);
        datePicker.max = formatDateISO(maxDate);

        // 1. 오늘부터 30일 후까지 (총 31일치) 하루씩 개별 호출하여 API 수량제한(5건)을 완벽히 우회
        async function loadRangeMealData() {
            isDataLoading = true;
            mealRangeCache = [];
            const promises = [];
            const todayObj = new Date();

            for (let i = 0; i <= 30; i++) {
                const targetDate = new Date(todayObj);
                targetDate.setDate(todayObj.getDate() + i);
                const dateStr = formatDateStr(targetDate);

                const url = `https://open.neis.go.kr/hub/mealServiceDietInfo?Type=json&ATPT_OFCDC_SC_CODE=${officeCode}&SD_SCHUL_CODE=${schoolCode}&MLSV_YMD=${dateStr}`;
                
                promises.push(
                    fetch(url)
                        .then(res => res.json())
                        .then(data => data.mealServiceDietInfo?.[1]?.row || [])
                        .catch(() => [])
                );
            }

            try {
                const results = await Promise.all(promises);
                let combinedRows = [];
                results.forEach(rows => {
                    combinedRows = combinedRows.concat(rows);
                });

                // 데이터 중복 제거 (날짜 + 식단구분)
                const uniqueMap = new Map();
                combinedRows.forEach(row => {
                    const key = `${row.MLSV_YMD}_${row.MMEAL_SC_CODE}`;
                    if (!uniqueMap.has(key)) {
                        uniqueMap.set(key, row);
                    }
                });

                mealRangeCache = Array.from(uniqueMap.values());
                isDataLoading = false;

                if (searchInput.value.trim()) {
                    executeSearch();
                }
            } catch (err) {
                console.error("데이터 로딩 실패:", err);
                isDataLoading = false;
            }
        }

        // 2. 선택한 날짜의 급식표 화면 표시 (조식/중식/석식)
        function fetchMealData(selectedDateISO) {
            const [year, month, day] = selectedDateISO.split('-');
            const dateStr = `${year}${month}${day}`;

            document.getElementById('date-display').innerText = `${year}년 ${parseInt(month)}월 ${parseInt(day)}일`;

            const apiUrl = `https://open.neis.go.kr/hub/mealServiceDietInfo?Type=json&ATPT_OFCDC_SC_CODE=${officeCode}&SD_SCHUL_CODE=${schoolCode}&MLSV_YMD=${dateStr}`;
            const container = document.getElementById('meal-container');
            container.innerHTML = `<div style="text-align:center; color:#64748b;">급식 정보를 불러오는 중입니다 ⏳</div>`;

            fetch(apiUrl)
                .then(res => res.json())
                .then(data => {
                    container.innerHTML = ""; 

                    if (data.mealServiceDietInfo) {
                        const rows = data.mealServiceDietInfo[1].row;
                        const mealData = { "조식": "", "중식": "", "석식": "" };

                        rows.forEach(item => {
                            const type = item.MMEAL_SC_NM;
                            if (mealData.hasOwnProperty(type)) {
                                mealData[type] = item.DDISH_NM;
                            }
                        });

                        ["조식", "중식", "석식"].forEach(type => {
                            const card = document.createElement('div');
                            card.className = 'meal-card';
                            
                            const content = mealData[type];
                            if (content) {
                                card.innerHTML = `
                                    <div class="meal-title">🍴 ${type}</div>
                                    <div class="meal-content">${content}</div>
                                `;
                            } else {
                                card.innerHTML = `
                                    <div class="meal-title">🍴 ${type}</div>
                                    <div class="meal-content no-meal">식단 정보가 없습니다.</div>
                                `;
                            }
                            container.appendChild(card);
                        });

                    } else if (data.RESULT) {
                        container.innerHTML = `<div class="meal-card" style="text-align:center;">오늘은 급식이 없습니다 😴<br><span class="no-meal">(${data.RESULT.MESSAGE})</span></div>`;
                    } else {
                        container.innerHTML = `<div class="meal-card" style="text-align:center;">급식 정보를 찾을 수 없습니다.</div>`;
                    }
                })
                .catch(err => {
                    console.error(err);
                    container.innerHTML = `<div class="meal-card" style="text-align:center;">급식 데이터를 불러오는 데 실패했습니다.</div>`;
                });
        }

        // 식단 구분 태그 HTML 생성
        function getMealBadgeHtml(mealType) {
            if (mealType === "조식") return `<span class="badge badge-breakfast">조식</span>`;
            if (mealType === "중식") return `<span class="badge badge-lunch">중식</span>`;
            if (mealType === "석식") return `<span class="badge badge-dinner">석식</span>`;
            return `<span class="badge">${mealType}</span>`;
        }

        // 3. 실시간 메뉴 검색 함수 (검색 결과 중복 완벽 제거)
        function executeSearch() {
            const keyword = searchInput.value.trim().toLowerCase();
            if (!keyword) {
                searchResults.style.display = 'none';
                return;
            }

            if (isDataLoading) {
                searchResults.innerHTML = `<div class="search-item" style="color:#94a3b8; justify-content:center;">30일치 급식 데이터를 불러오는 중입니다... ⏳</div>`;
                searchResults.style.display = 'block';
                return;
            }

            const matches = [];
            const seenKeys = new Set(); // 검색 결과 항목 중복 검사 전용

            mealRangeCache.forEach(item => {
                const mealType = item.MMEAL_SC_NM; // "조식", "중식", "석식"
                
                // 선택한 필터(전체/조식/중식/석식) 조건 체크
                if (currentFilter !== 'ALL' && mealType !== currentFilter) {
                    return;
                }

                const ymd = item.MLSV_YMD;
                const dishes = item.DDISH_NM ? item.DDISH_NM.split(/<br\s*\/?>/i) : [];

                dishes.forEach(dish => {
                    const cleanName = dish.replace(/\s*\([0-9.]+\)/g, '').trim();
                    if (cleanName && cleanName.toLowerCase().includes(keyword)) {
                        const iso = `${ymd.substr(0,4)}-${ymd.substr(4,2)}-${ymd.substr(6,2)}`;
                        const code = parseInt(item.MMEAL_SC_CODE || (mealType === "조식" ? 1 : mealType === "중식" ? 2 : 3));
                        
                        // 날짜_식단_메뉴이름 기준 중복 검사
                        const uniqueKey = `${ymd}_${mealType}_${cleanName}`;
                        if (!seenKeys.has(uniqueKey)) {
                            seenKeys.add(uniqueKey);
                            matches.push({
                                name: cleanName,
                                dateISO: iso,
                                mealType: mealType,
                                rawDate: ymd,
                                mealCode: code
                            });
                        }
                    }
                });
            });

            // 날짜 오름차순, 같은 날짜면 조식 -> 중식 -> 석식 순 정렬
            matches.sort((a, b) => {
                if (a.rawDate !== b.rawDate) {
                    return a.rawDate.localeCompare(b.rawDate);
                }
                return a.mealCode - b.mealCode;
            });

            if (matches.length === 0) {
                searchResults.innerHTML = `<div class="search-item" style="color:#94a3b8; justify-content:center;">일치하는 메뉴가 없습니다.</div>`;
            } else {
                const dayNames = ['일', '월', '화', '수', '목', '금', '토'];
                searchResults.innerHTML = matches.slice(0, 50).map(m => {
                    const month = parseInt(m.dateISO.substr(5, 2));
                    const day = parseInt(m.dateISO.substr(8, 2));
                    const dObj = new Date(`${m.dateISO}T00:00:00`);
                    const dayOfWeek = dayNames[dObj.getDay()];

                    return `
                        <div class="search-item" data-date="${m.dateISO}">
                            <div class="search-item-left">
                                <strong>${m.name}</strong>
                                ${getMealBadgeHtml(m.mealType)}
                            </div>
                            <span class="search-item-date">${month}/${day}(${dayOfWeek})</span>
                        </div>
                    `;
                }).join('');
            }
            searchResults.style.display = 'block';
        }

        // 검색창 입력 이벤트
        searchInput.addEventListener('input', executeSearch);

        // 필터 버튼 클릭 이벤트 (전체/조식/중식/석식)
        filterBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                filterBtns.forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentFilter = btn.dataset.filter;
                executeSearch(); 
            });
        });

        // 검색 결과 클릭 시 선택한 날짜 급식표로 이동
        searchResults.addEventListener('click', (e) => {
            const item = e.target.closest('.search-item');
            if (item && item.dataset.date) {
                const selectedDate = item.dataset.date;
                datePicker.value = selectedDate;
                fetchMealData(selectedDate);
                searchResults.style.display = 'none';
                searchInput.value = '';
            }
        });

        // 외부 영역 클릭 시 검색 드롭다운 닫기
        document.addEventListener('click', (e) => {
            if (!e.target.closest('.search-box') && !e.target.closest('.filter-buttons')) {
                searchResults.style.display = 'none';
            }
        });

        // 초기 실행
        loadRangeMealData();
        fetchMealData(datePicker.value);

        // 달력 날짜 선택 시 갱신
        datePicker.addEventListener('change', (e) => {
            fetchMealData(e.target.value);
        });
    </script>
</body>
</html>
